name: knowledgeos-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kos
      POSTGRES_PASSWORD: kos
      POSTGRES_DB: knowledgeos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kos -d knowledgeos']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://kos:kos@postgres:5432/knowledgeos
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
    volumes:
      - objects:/data
    command:
      - sh
      - -c
      - pnpm --filter @kos/database migrate:deploy && pnpm --filter @kos/database seed && node apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/api/v1/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP: worker
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kos:kos@postgres:5432/knowledgeos
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
    volumes:
      - objects:/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  objects:
